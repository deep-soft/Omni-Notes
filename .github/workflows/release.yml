name: release

# on: [push, pull_request]
on:
  workflow_dispatch:

env:
  TAG_NAME: release

jobs:
  build-and-test:
    name: Build and publish release
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout source code
        uses: deep-soft/checkout@v3
        
      - name: Setup JDK 11
        uses: actions/setup-java@v1
        with:
          java-version: 11

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
      
      - name: Build Release
        continue-on-error: true
        run: |
          ./gradlew build
          
      - name: List Release
        run: |
          ls -lR > lslR-release.txt

      - name: Upload Artifact release
        uses: deep-soft/upload-artifact@v3
        with:
          name: lslR-release.txt
          path: lslR-release.txt

      - name: Upload apk
        uses: deep-soft/upload-artifact@v3
        with:
          name: OmniNotes-fossRelease-6.1.0.apk
          path: ./omniNotes/build/outputs/apk/foss/release/OmniNotes-fossRelease-6.1.0.apk

      - name: Publish unsigned Release
        uses: deep-soft/action-gh-release@v1
        with:
          prerelease: true
          tag_name: ${{ env.TAG_NAME }}
          files: |
            ./omniNotes/build/outputs/apk/foss/release/OmniNotes-fossRelease-6.1.0.apk

      - name: Prepare for sign apk
        run: |
          mkdir -p signed-apk; pushd signed-apk
          cp ../omniNotes/build/outputs/apk/foss/release/OmniNotes-fossRelease-6.1.0.apk .

      - uses: deep-soft/sign-android-release@master
        name: Sign app APK
        continue-on-error: true
        if: env.ANDROID_SIGNING_KEY != null
        id: sign-android
        with:
          releaseDirectory: ./signed-apk
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        env:
          # override default build-tools version (29.0.3) -- optional
          BUILD_TOOLS_VERSION: "30.0.2"

      - name: Upload Artifacts
        continue-on-error: true
        if: env.ANDROID_SIGNING_KEY != null
        uses: deep-soft/upload-artifact@v3
        with:
          name: OmniNotes-fossRelease-6.1.0-signed.apk
          path: ${{steps.sign-android.outputs.signedReleaseFile}}

      - name: Publish signed apk package
        continue-on-error: true
        if: env.ANDROID_SIGNING_KEY != null
        uses: deep-soft/action-gh-release@v1
        with:
          prerelease: true
          tag_name: ${{ env.TAG_NAME }}
          files: |
            ${{steps.sign-android.outputs.signedReleaseFile}}
